dependencies {
    testImplementation(
        project(':api'),
        libs.rest.assured,
        libs.java.faker,
        libs.cucumber.java,
        libs.cucumber.junit.platform.engine,
        libs.junit.platform.suite
    )

    testRuntimeOnly(
        libs.junit.platform.launcher
    )
}

// The Cucumber scenarios call a running back-office instance, so they are not part of `test`/`check`.
// Start the stack (see the loans-infra repository) and run them with `./gradlew :acceptance-tests:acceptanceTest`.
tasks.named('test') {
    enabled = false
}

Provider<String> acceptanceBaseUri = providers.gradleProperty('acceptance.baseUri')

tasks.register('acceptanceTest', Test) {
    description = 'Runs the Cucumber acceptance tests against a running back-office (default http://localhost:8080).'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()

    if (acceptanceBaseUri.isPresent()) {
        systemProperty 'acceptance.baseUri', acceptanceBaseUri.get()
    }

    // The result depends on the state of the external services, never reuse a previous run
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
}
