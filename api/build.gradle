plugins {
    id 'jacoco'
}

dependencies {
    implementation(
        libs.spring.boot.starter.validation
    )

    testImplementation(
        libs.groovy,
        libs.spock.core,
        libs.spock.spring
    )

    testRuntimeOnly(
        "org.junit.platform:junit-platform-launcher"
    )

}

check {
    dependsOn(tasks.jacocoTestCoverageVerification)
}

jacocoTestCoverageVerification {
    // Enums, records and exceptions have no logic; their generated lines would only pad or sink the ratio
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(it) {
            exclude(
                '**/exceptions/**',
                '**/Status.class',
                '**/RiskRejectionReason.class',
                '**/*Request.class',
                '**/*Response.class',
                '**/EmailMessage.class'
            )
        }
    }))
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = '0.7'.toBigDecimal()
            }
        }
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = providers.environmentVariable('CI').isPresent()
        csv.required = false
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}