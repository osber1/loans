logging:
  file:
    name: build/logs/back-office.log

spring:
  cloud:
    openfeign:
      client:
        config:
          risk-checker:
            read-timeout: 500

rabbitmq:
  exchanges:
    internal: internal.exchange
  queues:
    notification: notification.queue
  routing-keys:
    internal-notification: internal.notification.routing-key

scheduler:
  relayNotificationOutbox:
    enabled: false
  evaluateNotEvaluatedLoans:
    enabled: false
