plugins {
    id 'groovy'
    id 'checkstyle'
    id 'codenarc'
    alias(libs.plugins.spring.dependency)
    alias(libs.plugins.spotbugs)
    alias(libs.plugins.sonarqube)
    alias(libs.plugins.errorprone)
    alias(libs.plugins.dependency.check)
}

apply from: 'config/error-prone/rules.gradle'

allprojects {
    group = 'io.osvaldas'
    version = '1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

sonar {
    properties {
        property 'sonar.projectName', 'loans'
        property 'sonar.projectKey', 'osber1_loans'
        property 'sonar.organization', 'osber1'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.java.binaries', '**/*'
    }
}

subprojects {
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'groovy'
    apply plugin: 'checkstyle'
    apply plugin: 'codenarc'
    apply plugin: 'com.github.spotbugs'
    apply plugin: 'org.sonarqube'
    apply plugin: 'net.ltgt.errorprone'
    apply plugin: 'org.owasp.dependencycheck'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.spring.boot.get()}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${libs.versions.spring.cloud.release.get()}"
        }
    }

    spotbugs {
        excludeFilter = file("${rootDir}/config/spotbugs/exclude.xml")
    }

    dependencies {
        errorprone(
            libs.error.prone,
            libs.error.prone.picnic.support,
            libs.error.prone.picnic.refaster
        )

        implementation(
            libs.spring.boot.starter.web,
            libs.spring.boot.starter.validation
        )

        // Lombok is only needed at compile time and must not end up in the boot jars
        compileOnly(
            libs.lombok
        )

        annotationProcessor(
            libs.lombok,
            libs.spring.boot.configuration.processor
        )

        testImplementation(
            libs.spring.boot.starter.test,
            libs.spring.boot.webmvc.test,
            libs.spring.boot.cache.test,
            libs.wiremock
        )
    }

    // Bootstrap configuration (bootstrap*.yml) and JSON logging (logback-spring.xml) are only used by the
    // deployable Spring Boot applications, not by the shared libraries or the acceptance tests
    plugins.withId('org.springframework.boot') {
        dependencies {
            implementation(
                libs.spring.boot.starter.bootstrap,
                libs.logstash
            )
        }
    }

    // Error Prone runs the configured rule set on every compilation and only reports findings.
    // Rewriting sources in place is opt-in, so regular builds stay cacheable:
    //   ./gradlew compileJava compileTestJava -PerrorpronePatch
    boolean errorPronePatch = providers.gradleProperty('errorpronePatch').isPresent()

    tasks.withType(JavaCompile).configureEach {
        options.errorprone {
            disableWarningsInGeneratedCode = true
            // The rule list contains a few names that are not (or no longer) Error Prone checks
            ignoreUnknownCheckNames = true
            checks = disabled_error_prone_checks

            String disabledRules = disabled_error_prone_rules.join('|')
            errorproneArgs.add("-XepOpt:Refaster:NamePattern=^(?!.*(?:($disabledRules))).*\$")

            if (errorPronePatch) {
                errorproneArgs.addAll(
                    "-XepPatchChecks:Refaster,${enabled_error_prone_rules.join(',')}",
                    '-XepPatchLocation:IN_PLACE'
                )
            } else {
                // Enable the rule set at each check's default severity (style checks warn, correctness
                // checks keep failing the build as they did before) without touching the sources.
                enable(*enabled_error_prone_rules)
            }
        }
    }
}
