server:
  port: 8082

logging:
  file:
    name: logs/notification-service.log

spring:
  output:
    ansi:
      enabled: ALWAYS
  rabbitmq:
    host: localhost
    listener:
      simple:
        # A message that keeps failing is retried a few times and then rejected without requeue,
        # so the broker dead-letters it (see the notification-dlx policy in loans-infra)
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  mail:
    host: localhost
    port: 1025
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoints:
    web:
      exposure:
        include:
          - "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

email:
  senderAddress: hello@osber.com
  subject: Confirm your email
  activationLink: http://localhost:8080/api/v1/clients/%s/activation?token=%s

---
spring:
  config:
    activate:
      on-profile: docker,k8s

logging:
  file:
    name: ""
  structured:
    format:
      console: logstash
    json:
      rename:
        logger_name: class
      add:
        hostname: ${HOSTNAME:}
        app: ${spring.application.name}
        profiles: ${spring.profiles.active:}
